[project]
name = "uptimemonitor"
version = "0.1.0"
description = "Open-source engine for website monitoring with uptime checks, alerts, and FastAPI API. Core is open; subscription service includes dashboards, history, and support."
authors = [
    {name = "Maximasdasd",email = "maxim696uae@outlook.com"}
]
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.5,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "uptimemonitor", from = "api" }]
